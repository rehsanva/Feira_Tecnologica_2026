<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alimenta+ | Cadastro de Ponto</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Cores Sobrias e Institucionais */
      --verde-institucional: #0e5a36;
      --verde-hover: #0a4328;
      --verde-suave: #f0f7f3;
      --destaque-amber: #d97706;
      --bg: #f8faf8;
      --card: #ffffff;
      --texto-principal: #111827;
      --texto-secundario: #4b5563;
      --borda: #d1d5db;
      --borda-foco: #0e5a36;
      --sombra: rgba(0, 0, 0, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--texto-principal);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Header e Navegação */
    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav {
      width: min(1120px, 92%);
      margin: 0 auto;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo a {
      text-decoration: none;
      color: var(--verde-institucional);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo strong {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .logo span {
      font-size: 0.75rem;
      background-color: var(--verde-suave);
      color: var(--verde-institucional);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    nav ul {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav ul li a {
      text-decoration: none;
      color: var(--texto-secundario);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    nav ul li a:hover {
      color: var(--verde-institucional);
    }

    /* Card Principal */
    .cadastro {
      width: min(840px, 92%);
      margin: 48px auto 80px;
      background: var(--card);
      padding: 48px 40px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 6px -1px var(--sombra), 0 2px 4px -2px var(--sombra);
    }

    /* Títulos */
    .titulo-secao {
      margin-bottom: 36px;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 24px;
    }

    .titulo-secao h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--verde-institucional);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .titulo-secao h3 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--texto-principal);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .titulo-secao p {
      color: var(--texto-secundario);
      font-size: 0.95rem;
    }

    /* Formulário e Layout */
    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 24px;
      align-items: start;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .campo-completo {
      grid-column: 1 / -1;
    }

    .campo > label {
      color: var(--texto-principal);
      font-size: 0.875rem;
      font-weight: 600;
    }

    /* Inputs e Textareas */
    input[type="text"],
    input[type="tel"],
    textarea {
      width: 100%;
      border: 1px solid var(--borda);
      border-radius: 6px;
      padding: 10px 14px;
      background: #ffffff;
      color: var(--texto-principal);
      font-family: inherit;
      font-size: 0.925rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #9ca3af;
    }

    input[type="text"]:focus,
    input[type="tel"]:focus,
    textarea:focus {
      border-color: var(--borda-foco);
      box-shadow: 0 0 0 3px rgba(14, 90, 54, 0.1);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* Seleção de Alimentos (Checkboxes) */
    .opcoes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    .opcoes label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--borda);
      border-radius: 6px;
      background: #ffffff;
      color: var(--texto-secundario);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .opcoes label:hover {
      background: var(--verde-suave);
      border-color: var(--verde-institucional);
      color: var(--verde-institucional);
    }

    .opcoes input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--verde-institucional);
      cursor: pointer;
    }

    /* Termos e Validação */
    .campo-completo > label.checkbox-termo {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--texto-secundario);
      font-size: 0.875rem;
      font-weight: 400;
      cursor: pointer;
      margin-top: 8px;
    }

    .campo-completo > label.checkbox-termo input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      accent-color: var(--verde-institucional);
      flex-shrink: 0;
    }

    /* Botão de Envio */
    button[type="submit"] {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      background: var(--verde-institucional);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      margin-top: 10px;
    }

    button[type="submit"]:hover {
      background: var(--verde-hover);
    }

    button[type="submit"]:active {
      transform: translateY(1px);
    }

    /* Responsividade */
    @media (max-width: 640px) {
      nav {
        flex-direction: column;
        justify-content: center;
        height: auto;
        padding: 14px 0;
        gap: 12px;
      }

      nav ul {
        gap: 12px 16px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .cadastro {
        padding: 28px 20px;
        margin: 24px auto 40px;
      }

      form {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .opcoes {
        flex-direction: column;
      }

      .opcoes label {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <div class="logo">
        <a href="index.html"><strong>Alimenta+</strong> <span>Rede Solidária</span></a>
      </div>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="index.html#mapa">Mapa</a></li>
        <li><a href="index.html#como-funciona">Como funciona</a></li>
        <li><a href="index.html#ods-2">ODS 2</a></li>
        <li><a href="index.html#ajudar">Ajudar</a></li>
        <li><a href="index.html#contato">Contato</a></li>
      </ul>
    </nav>
  </header>

  <section id="cadastro" class="cadastro">
    <div class="titulo-secao">
      <h2>Cadastro de Ponto</h2>
      <h3>Conhece ou administra um local de distribuição?</h3>
      <p>Preencha os dados abaixo para integrar o ponto à nossa rede de mapeamento de combate à fome.</p>
    </div>

    <form>
      <div class="campo">
        <label for="nome-ponto">Nome do ponto *</label>
        <input type="text" id="nome-ponto" name="nome-ponto" placeholder="Ex.: Cozinha Solidária Esperança" required>
      </div>

      <div class="campo">
        <label for="responsavel">Nome do responsável</label>
        <input type="text" id="responsavel" name="responsavel" placeholder="Ex.: Maria da Silva">
      </div>

      <div class="campo">
        <label for="endereco">Endereço completo *</label>
        <input type="text" id="endereco" name="endereco" placeholder="Rua, número e bairro" required>
      </div>

      <div class="campo">
        <label for="cidade">Cidade / UF *</label>
        <input type="text" id="cidade" name="cidade" placeholder="Ex.: São Paulo - SP" required>
      </div>

      <div class="campo">
        <label for="telefone">Telefone para contato</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
      </div>

      <div class="campo">
        <label for="horario">Horário de atendimento *</label>
        <input type="text" id="horario" name="horario" placeholder="Ex.: Segunda a sexta, das 11h às 14h" required>
      </div>

      <div class="campo campo-completo">
        <label>Tipos de alimento distribuídos</label>
        <div class="opcoes">
          <label><input type="checkbox" name="alimento" value="marmitas"> Marmitas prontas</label>
          <label><input type="checkbox" name="alimento" value="cestas"> Cestas básicas</label>
          <label><input type="checkbox" name="alimento" value="frutas"> Hortifrúti / Orgânicos</label>
          <label><input type="checkbox" name="alimento" value="paes"> Pães e panificados</label>
        </div>
      </div>

      <div class="campo campo-completo">
        <label for="regras">Regras e requisitos para retirada</label>
        <textarea id="regras" name="regras" placeholder="Informe se há necessidade de cadastro prévio, apresentação de documento, limite por pessoa, etc."></textarea>
      </div>

      <div class="campo campo-completo">
        <label for="observacoes">Observações adicionais</label>
        <textarea id="observacoes" name="observacoes" placeholder="Informações sobre ponto de referência, acesso para PCD, aceitação de doações, etc."></textarea>
      </div>

      <div class="campo campo-completo">
        <label class="checkbox-termo">
          <input type="checkbox" name="confirmacao" required>
          Declaramos que as informações acima são precisas e representam um ponto ativo de apoio comunitário.
        </label>
      </div>

      <div class="campo campo-completo">
        <button type="submit">Enviar Formulário de Cadastro</button>
      </div>
    </form>
  </section>
</body>
</html>

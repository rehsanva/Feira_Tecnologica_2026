   <div class="max-w-6xl mx-auto px-4 mt-8 pt-6 border-t border-gray-700 text-center text-sm text-gray-500">
    <p data-template-id="footer-copy" class="canva-text"></p>
   </div>

  <script src="/_sdk/1a0e63f7a958ec3e.editing_sdk.js" integrity="sha512-lW+iibZ5vXaBl3IQ1K3ooQE1gfdDZxiO+Y7NpWdeypLOwr1WIYo3edm3nu+wyePemyM75tcU3yV7YyImK9wxMQ=="></script>
  <script src="/_sdk/0e8d3a91e1c6f495.data_sdk.js" integrity="sha512-c00oDoGjsMgluCLLEyVl3suwEkgjOGGplVFbsilUoBg4aMKNmsL3mwsc9r0dPn95qiSZyjBousQXgROkAW7p/w=="></script>
  <script>
        // Dark mode
        function toggleDark() {
            document.documentElement.classList.toggle('dark');
        }

        // Font size
        let fontLevel = 0;
        function changeFontSize() {
            fontLevel = (fontLevel + 1) % 3;
            document.body.classList.remove('font-size-large', 'font-size-xlarge');
            if (fontLevel === 1) document.body.classList.add('font-size-large');
            if (fontLevel === 2) document.body.classList.add('font-size-xlarge');
        }

        // Contrast
        function toggleContrast() {
            document.body.classList.toggle('high-contrast');
        }

        // FAQ
        document.querySelectorAll('.faq-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const answer = btn.nextElementSibling;
                const isOpen = answer.classList.contains('open');
                document.querySelectorAll('.faq-answer').forEach(a => a.classList.remove('open'));
                if (!isOpen) answer.classList.add('open');
                btn.setAttribute('aria-expanded', !isOpen);
            });
        });

        // Stats animation
        const statsObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    document.querySelectorAll('.stat-item').forEach(item => {
                        const target = parseInt(item.dataset.target);
                        const numEl = item.querySelector('.stat-number');
                        let current = 0;
                        const step = Math.ceil(target / 60);
                        const interval = setInterval(() => {
                            current += step;
                            if (current >= target) { current = target; clearInterval(interval); }
                            numEl.textContent = '+' + current.toLocaleString('pt-BR');
                        }, 25);
                    });
                    statsObserver.disconnect();
                }
            });
        }, { threshold: 0.3 });
        statsObserver.observe(document.getElementById('stats-grid'));

        // Map
        const map = L.map('map').setView([-23.55, -46.63], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const locations = [
            { lat: -23.545, lng: -46.635, name: 'Restaurante Bom Prato - Sé', type: 'refeicao', address: 'R. Maria Paula, 101 - Bela Vista', hours: 'Seg-Sex 7h-14h', phone: '(11) 3333-1234', service: '🍽 Refeições prontas' },
            { lat: -23.560, lng: -46.655, name: 'Banco de Alimentos SP', type: 'banco', address: 'Av. Dr. Gastão V. de Moura, 226', hours: 'Seg-Sex 8h-17h', phone: '(11) 3334-5678', service: '🥬 Banco de alimentos' },
            { lat: -23.530, lng: -46.620, name: 'ONG Ação da Cidadania', type: 'ong', address: 'R. Augusta, 1200 - Consolação', hours: 'Seg-Sáb 9h-18h', phone: '(11) 3335-9012', service: '🧑‍🤝‍🧑 ONG' },
            { lat: -23.575, lng: -46.640, name: 'Cozinha Solidária Vila Mariana', type: 'refeicao', address: 'R. Domingos de Morais, 800', hours: 'Seg-Sex 11h-14h', phone: '(11) 3336-3456', service: '❤️ Cozinha solidária' },
            { lat: -23.520, lng: -46.670, name: 'Ponto de Cestas - Lapa', type: 'cesta', address: 'R. Guaicurus, 500 - Lapa', hours: 'Qua e Sáb 8h-12h', phone: '(11) 3337-7890', service: '🛒 Cestas básicas' },
        ];

        const markers = [];
        locations.forEach(loc => {
            const marker = L.marker([loc.lat, loc.lng]).addTo(map);
            marker.bindTooltip(loc.name);
            marker.on('click', () => showDetail(loc));
            marker._locType = loc.type;
            markers.push(marker);
        });

        function showDetail(loc) {
            const d = document.getElementById('map-detail');
            d.classList.remove('hidden');
            document.getElementById('detail-name').textContent = loc.name;
            document.getElementById('detail-address').textContent = loc.address;
            document.getElementById('detail-hours').textContent = loc.hours;
            document.getElementById('detail-phone').textContent = loc.phone;
            document.getElementById('detail-type').textContent = loc.service;
        }

        // Filters
        document.querySelectorAll('.filter-cb').forEach(cb => {
            cb.addEventListener('change', () => {
                const active = [...document.querySelectorAll('.filter-cb:checked')].map(c => c.dataset.type);
                markers.forEach(m => {
                    if (active.includes(m._locType)) { m.addTo(map); }
                    else { map.removeLayer(m); }
                });
            });
        });

        // Contact form
        (async () => {
            const handler = { onDataChanged() {} };
            await window.dataSdk.init(handler);
        })();

        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.querySelector('[data-template-id="form-submit-btn"]');
            btn.disabled = true;
            btn.style.opacity = '0.6';

            const record = {
                name: document.getElementById('f-name').value,
                email: document.getElementById('f-email').value,
                city: document.getElementById('f-city').value,
                message: document.getElementById('f-msg').value,
                created_at: new Date().toISOString()
            };

            const result = await window.dataSdk.create(record);
            btn.disabled = false;
            btn.style.opacity = '1';

            if (result.isOk) {
                document.getElementById('form-success').classList.remove('hidden');
                document.getElementById('form-error').classList.add('hidden');
                e.target.reset();
            } else {
                document.getElementById('form-error').classList.remove('hidden');
                document.getElementById('form-success').classList.add('hidden');
            }
        });

        // Init icons
        lucide.createIcons();
    </script>
 </body>
</html>
